name: Build Android trial APK
on:
  workflow_dispatch:
    inputs:
      site_url:
        description: 'رابط الموقع المستضاف كاملًا ويبدأ بـ https://'
        required: true
        type: string
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build trial APK
        working-directory: android
        env:
          ORG_GRADLE_PROJECT_yallaUrl: ${{ inputs.site_url }}
        run: gradle --no-daemon :app:assembleDebug :app:lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Yalla-Toktok-trial-APK
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
